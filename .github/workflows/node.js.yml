# Lints, type-checks, and builds on every push to main and every pull request.
# Deploys are handled by Vercel's Git integration, not by this workflow.

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A new push to the same PR/branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - run: npm ci
    - name: Lint
      run: npm run lint
    - name: Type check
      run: npm run typecheck
    - name: Build
      run: npm run build
